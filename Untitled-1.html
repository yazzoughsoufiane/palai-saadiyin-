<!DOCTYPE html>
<html lang="fr-MA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#22242a">
    <title>Google</title>
    
    <!-- 1. Styles de base et Variables CSS (Thème sombre/clair) -->
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        :root {
            --xhUGwc: #22242a; /* Fond sombre */
            --YLNNHc: #e8e8e8; /* Texte */
            --mXZkqc: #444746; /* Bordures */
            --JKqx2: #99c3ff;  /* Liens */
        }
        body {
            background-color: var(--xhUGwc);
            color: var(--YLNNHc);
            font-family: arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        a {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>

    <!-- 2. Styles spécifiques aux composants (Header, Barre de recherche) -->
    <style>
        /* Header & Navigation */
        .header-nav {
            display: flex;
            justify-content: flex-end;
            padding: clamp(8px, 3vw, 15px);
            gap: clamp(10px, 3vw, 15px);
            align-items: center;
            flex-wrap: wrap;
        }

        .header-nav a {
            color: var(--JKqx2);
            text-decoration: none;
            font-size: clamp(12px, 3vw, 14px);
            padding: 8px 12px;
            border-radius: 4px;
            transition: background 0.2s;
            cursor: pointer;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-nav a:active {
            background: rgba(153, 195, 255, 0.1);
        }

        .header-nav button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            min-width: 44px;
            touch-action: manipulation;
        }

        .header-nav button:active {
            background: rgba(153, 195, 255, 0.1);
        }

        .header-nav button svg {
            width: clamp(18px, 4vw, 24px);
            height: clamp(18px, 4vw, 24px);
        }

        .header-nav img {
            width: clamp(28px, 6vw, 32px);
            height: clamp(28px, 6vw, 32px);
            cursor: pointer;
            border-radius: 50%;
            padding: 4px;
            transition: background 0.2s;
        }

        .header-nav img:active {
            background: rgba(153, 195, 255, 0.1);
        }
        
        /* Conteneur principal (Logo + Recherche) */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(10px, 3vw, 50px);
            margin-top: clamp(-30px, -8vw, -50px);
        }

        .logo {
            margin-bottom: clamp(20px, 5vw, 40px);
        }

        .logo img {
            width: clamp(150px, 50vw, 272px);
            height: auto;
        }

        /* Barre de recherche personnalisée (Style Google Dark) */
        .search-container {
            width: 100%;
            max-width: 584px;
            padding: 0 clamp(8px, 3vw, 20px);
            margin-top: clamp(10px, 3vw, 20px);
            position: relative;
        }

        .search-bar {
            display: flex;
            background: #4d5156;
            border: 1px solid transparent;
            border-radius: 24px;
            padding: clamp(8px, 2vw, 10px) clamp(12px, 3vw, 20px);
            align-items: center;
            gap: 8px;
            transition: background 0.2s, box-shadow 0.2s;
            touch-action: manipulation;
        }

        .search-bar:hover,
        .search-bar:focus-within {
            background: #5f6368;
            box-shadow: 0 1px 6px rgba(0,0,0,0.28);
        }

        .search-bar svg {
            width: clamp(16px, 4vw, 20px);
            height: clamp(16px, 4vw, 20px);
            flex-shrink: 0;
        }

        .search-input {
            background: transparent;
            border: none;
            color: white;
            flex-grow: 1;
            font-size: clamp(14px, 3vw, 16px);
            outline: none;
            padding: 0 clamp(6px, 2vw, 10px);
            min-height: 44px;
        }

        .search-input::placeholder {
            color: #9aa0a6;
        }

        .mic-icon {
            cursor: pointer;
            flex-shrink: 0;
            padding: 6px;
            border-radius: 4px;
            transition: background 0.2s;
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-icon:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .buttons-container {
            margin-top: clamp(20px, 5vw, 30px);
            text-align: center;
            display: flex;
            gap: clamp(6px, 2vw, 10px);
            justify-content: center;
            flex-wrap: wrap;
        }

        .buttons-container input[type="submit"],
        .buttons-container input[type="button"] {
            padding: clamp(8px, 2vw, 10px) clamp(12px, 3vw, 16px);
            background: #303134;
            border: 1px solid #303134;
            color: #e8eaed;
            border-radius: 4px;
            cursor: pointer;
            font-size: clamp(12px, 3vw, 14px);
            min-height: 44px;
            transition: background 0.2s, border-color 0.2s;
            touch-action: manipulation;
            -webkit-appearance: none;
            font-family: arial, sans-serif;
        }

        .buttons-container input[type="submit"]:active,
        .buttons-container input[type="button"]:active {
            background: #3c3f42;
            border-color: #3c3f42;
        }

        /* Pied de page */
        .footer {
            background: #171717;
            color: #bdc1c6;
            font-size: clamp(12px, 2.5vw, 14px);
            margin-top: auto;
        }

        .footer-location {
            padding: clamp(10px, 2vw, 15px) clamp(15px, 3vw, 30px);
            border-bottom: 1px solid #3c4043;
        }

        .footer-row {
            padding: clamp(10px, 2vw, 15px) clamp(15px, 3vw, 30px);
            border-top: 1px solid #3c4043;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .footer-links {
            display: flex;
            gap: clamp(8px, 2vw, 15px);
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #bdc1c6;
            text-decoration: none;
            padding: 6px 8px;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
            min-height: 44px;
            display: flex;
            align-items: center;
            touch-action: manipulation;
        }

        .footer-links a:active {
            background: rgba(189, 193, 198, 0.1);
            color: #e8eaed;
        }

        /* Responsive pour mobile */
        @media (max-width: 480px) {
            body {
                font-size: 15px;
            }

            .header-nav {
                padding: 8px 10px;
                gap: 8px;
            }

            .main-content {
                padding: 8px;
                margin-top: -20px;
            }

            .search-container {
                padding: 0 8px;
            }

            .footer-row {
                flex-direction: column;
                gap: 10px;
            }

            .footer-links {
                flex-direction: column;
                gap: 0;
            }

            .footer-links a {
                padding: 10px;
            }
        }

        /* Landscape mode */
        @media (max-height: 500px) {
            .main-content {
                margin-top: -10px;
            }

            .logo {
                margin-bottom: 10px;
            }

            .buttons-container {
                margin-top: 10px;
            }
        }

        /* Réduction des animations si demandé */
        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- SECTION : EN-TÊTE -->
    <header class="header-nav">
        <a href="#" onclick="showAlert('Gmail')">Gmail</a>
        <a href="#" onclick="showAlert('Images')">Images</a>
        <button title="Applications Google" onclick="showAlert('Google Apps')">
            <svg viewBox="0 0 24 24" fill="white">
                <path d="M6,8c1.1,0 2-0.9 2-2s-0.9-2-2-2-2,0.9-2,2 0.9,2 2,2zM12,20c1.1,0 2-0.9 2-2s-0.9-2-2-2-2,0.9-2,2 0.9,2 2,2zM6,20c1.1,0 2-0.9 2-2s-0.9-2-2-2-2,0.9-2,2 0.9,2 2,2zM6,14c1.1,0 2-0.9 2-2s-0.9-2-2-2-2,0.9-2,2 0.9,2 2,2zM12,14c1.1,0 2-0.9 2-2s-0.9-2-2-2-2,0.9-2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2-0.9 2-2-0.9-2-2-2-2,0.9-2,2zM12,8c1.1,0 2-0.9 2-2s-0.9-2-2-2-2,0.9-2,2 0.9,2 2,2zM18,14c1.1,0 2-0.9 2-2s-0.9-2-2-2-2,0.9-2,2 0.9,2 2,2zM18,20c1.1,0 2-0.9 2-2s-0.9-2-2-2-2,0.9-2,2 0.9,2 2,2z"></path>
            </svg>
        </button>
        <img src="https://lh3.google.com/u/0/ogw/AF2bZyha9A__R4cnGp95MsMdvwzQhQnzUhKYixY0ChY-7KsW5A=s32-c-mo" 
             alt="Profil" onclick="showAlert('Profil')">
    </header>

    <!-- SECTION : PRINCIPALE -->
    <main class="main-content">
        <!-- Logo -->
        <div class="logo">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_light_color_272x92dp.png" 
                 alt="Google">
        </div>

        <!-- Recherche -->
        <div class="search-container">
            <form action="javascript:void(0);" onsubmit="handleSearch()">
                <div class="search-bar">
                    <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#9aa0a6">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                    </svg>
                    <input class="search-input" id="searchInput" name="q" type="text" autocomplete="off" placeholder="Rechercher sur Google ou saisir une URL">
                    <!-- Icone Micro -->
                    <svg class="mic-icon" width="24" height="24" viewBox="0 0 24 24" onclick="handleMic()" style="cursor:pointer">
                        <path fill="#4285f4" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
                        <path fill="#34a853" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path>
                    </svg>
                </div>
                
                <div class="buttons-container">
                    <input type="submit" value="Recherche Google" onclick="handleSearch()">
                    <input type="button" value="J'ai de la chance" onclick="handleLucky()">
                </div>
            </form>
        </div>

        <!-- Langue -->
        <div style="margin-top: clamp(15px, 4vw, 25px); font-size: clamp(12px, 2.5vw, 14px); text-align: center;">
            Google disponible en : <a href="#" style="color: #8ab4f8; margin-left: 5px;" onclick="showAlert('العربية')">العربية</a>
        </div>
    </main>

    <!-- SECTION : PIED DE PAGE -->
    <footer class="footer">
        <div class="footer-location">Maroc</div>
        <div class="footer-row">
            <div class="footer-links">
                <a href="#" onclick="showAlert('À propos')">À propos</a>
                <a href="#" onclick="showAlert('Publicité')">Publicité</a>
                <a href="#" onclick="showAlert('Entreprise')">Entreprise</a>
                <a href="#" onclick="showAlert('Comment fonctionne la recherche')">Comment fonctionne la recherche</a>
            </div>
            <div class="footer-links">
                <a href="#" onclick="showAlert('Confidentialité')">Confidentialité</a>
                <a href="#" onclick="showAlert('Conditions')">Conditions</a>
                <a href="#" onclick="showAlert('Paramètres')">Paramètres</a>
            </div>
        </div>
    </footer>

    <script>
        // Empêcher le comportement par défaut des liens
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
                if (this.onclick) {
                    e.preventDefault();
                }
            });
        });

        function handleSearch() {
            const query = document.getElementById('searchInput').value;
            if (query.trim()) {
                showAlert('Recherche: ' + query);
            }
            return false;
        }

        function handleLucky() {
            showAlert('Redirection vers la première page de résultat');
            return false;
        }

        function handleMic() {
            showAlert('Fonction micro activée (nécessite l\'autorisation du microphone)');
        }

        function showAlert(message) {
            alert(message);
        }

        // Gestion du focus pour le clavier
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.focus();
            }
        });
    </script>

</body>
</html>
