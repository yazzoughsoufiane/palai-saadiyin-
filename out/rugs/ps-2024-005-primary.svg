<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" fill="#8B3A2E"/>
  <!-- Horizontal registers -->
  <rect x="0" y="100" width="400" height="6" fill="#1A1715" opacity="0.3"/>
  <rect x="0" y="200" width="400" height="6" fill="#1A1715" opacity="0.3"/>
  <rect x="0" y="300" width="400" height="6" fill="#1A1715" opacity="0.3"/>
  <rect x="0" y="400" width="400" height="6" fill="#1A1715" opacity="0.3"/>
  <rect x="0" y="500" width="400" height="6" fill="#1A1715" opacity="0.3"/>
  <!-- Register fills -->
  <rect x="20" y="106" width="360" height="88" fill="#C8843A" opacity="0.25"/>
  <rect x="20" y="406" width="360" height="88" fill="#C8843A" opacity="0.2"/>
  <!-- Geometric stepped fill in standard registers -->
  <g fill="#F4EFE7" opacity="0.3">
    <rect x="60" y="30" width="12" height="12" transform="rotate(45 66 36)"/>
    <rect x="110" y="30" width="12" height="12" transform="rotate(45 116 36)"/>
    <rect x="160" y="30" width="12" height="12" transform="rotate(45 166 36)"/>
    <rect x="210" y="30" width="12" height="12" transform="rotate(45 216 36)"/>
    <rect x="260" y="30" width="12" height="12" transform="rotate(45 266 36)"/>
    <rect x="310" y="30" width="12" height="12" transform="rotate(45 316 36)"/>
  </g>
  <!-- Botanical improvisation in two open registers -->
  <g stroke="#F4EFE7" stroke-width="1.5" fill="none" opacity="0.45">
    <path d="M 60 140 Q 80 120 100 140 Q 120 160 140 140"/>
    <path d="M 200 130 Q 230 110 250 135 Q 260 150 250 165"/>
    <path d="M 300 145 Q 320 125 340 145 Q 355 160 340 175"/>
    <!-- Second improvisation field -->
    <path d="M 50 440 Q 70 420 90 440 Q 110 460 130 440"/>
    <path d="M 180 430 Q 210 415 235 435"/>
    <circle cx="280" cy="445" r="12"/>
    <circle cx="330" cy="455" r="8"/>
  </g>
  <!-- Border -->
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#F4EFE7" stroke-width="3" opacity="0.2"/>
</svg>