<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" fill="#1E2B3D"/>
  <rect x="18" y="18" width="364" height="564" fill="none" stroke="#2E3B4E" stroke-width="6"/>
  <rect x="32" y="32" width="336" height="536" fill="none" stroke="#F4EFE7" stroke-width="1" opacity="0.2"/>
  <!-- Stacked medallion — ivory on indigo -->
  <g fill="#F4EFE7" opacity="0.8">
    <!-- Top medallion -->
    <polygon points="200,80 240,120 220,160 200,170 180,160 160,120"/>
    <!-- Middle medallion (main) -->
    <polygon points="200,220 255,260 240,320 200,340 160,320 145,260"/>
    <!-- Bottom medallion -->
    <polygon points="200,400 235,440 220,480 200,490 180,480 165,440"/>
  </g>
  <!-- Madder rose accents -->
  <g fill="#8B3A2E" opacity="0.7">
    <rect x="150" y="255" width="20" height="20" transform="rotate(45 160 265)"/>
    <rect x="220" y="255" width="20" height="20" transform="rotate(45 230 265)"/>
    <rect x="185" y="155" width="16" height="16" transform="rotate(45 193 163)"/>
    <rect x="197" y="440" width="14" height="14" transform="rotate(45 204 447)"/>
  </g>
  <!-- Saffron hourglass forms -->
  <g fill="#C8843A" opacity="0.5">
    <polygon points="80,250 100,270 80,290 60,270"/>
    <polygon points="320,250 340,270 320,290 300,270"/>
  </g>
  <!-- Intentional flaw in lower border -->
  <g stroke="#F4EFE7" stroke-width="1" fill="none" opacity="0.25">
    <line x1="32" y1="480" x2="160" y2="480"/>
    <line x1="240" y1="480" x2="368" y2="480"/>
    <!-- Gap at 160-240 — intentional flaw -->
  </g>
</svg>